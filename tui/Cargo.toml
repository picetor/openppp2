[package]
name = "ppp-tui"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Native Rust desktop client + Linux terminal client for the openppp2 headless core"

[[bin]]
name = "ppp-tui"
path = "src/main.rs"

[[bin]]
name = "ppp-tui-cli"
path = "src/bin/ppp-tui-cli.rs"

[[bin]]
name = "ppp-tui-slint"
path = "src/bin/ppp-tui-slint.rs"
required-features = ["slint-ui"]

[features]
slint-ui = ["dep:slint", "dep:slint-build"]

[dependencies]
eframe = "0.29"
slint = { version = "=1.13.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts"], optional = true }
image = { version = "0.25", default-features = false, features = ["ico"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
unicode-width = "0.2"

[build-dependencies]
slint-build = { version = "=1.13.1", optional = true }

[profile.release]
opt-level = 3
lto = true
strip = "symbols"
