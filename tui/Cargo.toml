[package]
name = "ppp-tui"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Native Rust desktop client + Linux terminal client for the openppp2 headless core"

[[bin]]
name = "ppp-tui"
path = "src/main.rs"

[[bin]]
name = "ppp-tui-cli"
path = "src/bin/ppp-tui-cli.rs"

[dependencies]
eframe = "0.29"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = "symbols"
