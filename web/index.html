<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPP PRIVATE NETWORK 2</title><link rel="stylesheet" href="/style.css"><script src="/session.js" defer></script><script src="/app.js" defer></script></head>
<body><header><strong>PPP PRIVATE NETWORK™ 2</strong><span id="connection-state" class="muted">正在连接控制端</span><span id="admin" class="yellow"></span><div class="spacer"></div><button id="uac">以管理员运行 · UAC</button><button data-page="settings">设置</button><button id="core-toggle">启动核心</button><button id="exit">退出</button></header>
<div class="shell"><aside><div class="muted">控制面板 · F1–F5</div><button data-page="overview" class="active">总览</button><button data-page="network">网络</button><button data-page="servers">服务器</button><button data-page="routes">分流</button><button data-page="settings">启动设置</button><div class="hint">Tab/Shift+Tab 聚焦<br>Enter/Space 执行</div><div class="spacer"></div><div class="muted">WEB / C++ CORE</div></aside><main>
<section id="overview" class="page active"><div class="toolbar"><label><input type="checkbox" data-setting="tun_enabled">TUN</label><label><input type="checkbox" data-setting="system_proxy_enabled">系统代理</label><button data-action="restart">应用设置并重启核心</button></div><div class="note">TUN 和系统代理可以自由开关；修改启动参数后，应用设置并重启核心生效。</div><div class="metrics" id="metrics"></div><h2>连接信息</h2><div id="connection"></div><h2>AI / API 控制</h2><div id="api"></div><h2>流量图</h2><div class="charts" id="charts"></div></section>
<section id="network" class="page"><div id="network-content"></div></section>
<section id="servers" class="page"><div class="toolbar"><h2 style="border:0;margin:0;padding:0" id="server-title">服务器</h2><div class="spacer"></div><button id="refresh-servers">刷新</button></div><div id="server-list"></div></section>
<section id="routes" class="page"><div class="toolbar"><button data-action="save">保存分流设置</button><button data-action="restart">应用分流并重启核心</button></div><div class="modes"><button data-route="ip">IP 分流<span>./ip.txt / ./ipv6.txt</span></button><button data-route="geo">GEO 分流<span>./geo-rules.yaml</span></button><button data-route="no">关闭用户分流<span>仅保留必要路由</span></button></div><div id="route-fields"></div><h2>运行时分流摘要</h2><div id="route-summary"></div><h2>Split Rules</h2><div id="route-rules"></div></section>
<section id="settings" class="page"><div class="toolbar"><button data-action="save">保存设置</button><button data-action="restart">应用设置并重启核心</button><span class="muted">启动参数在重启核心后生效</span></div><h2>软件配置</h2><div class="note" id="settings-path"></div><div id="settings-fields"></div><h2>启动命令预览</h2><pre id="command-preview"></pre><div class="note">命令由上方设置生成；RPC Token 在预览中隐藏。</div></section>
</main></div><footer><span id="status" role="status">正在读取核心状态…</span><span>WEB / C++ CORE</span></footer><div class="toast" id="toast" role="alert"></div></body></html>
