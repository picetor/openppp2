plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore/yav-release-key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "supersocksr.ppp.android"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    defaultConfig {
        applicationId "supersocksr.ppp.android"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        // android/build.sh writes ABI directories beneath repo/bin/android.
        // Consume that output directly after a successful native build.
        main.jniLibs.srcDirs += ["../../../bin/android"]
    }

    signingConfigs {
        release {
            if (!keystoreProperties.isEmpty()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            ndk {
                abiFilters "arm64-v8a", "x86_64"
            }
            // If a release keystore is configured, sign the debug APK with it
            // too so CI artifacts keep a stable, user-owned signature.
            if (!keystoreProperties.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            ndk {
                abiFilters "arm64-v8a"
            }
            if (!keystoreProperties.isEmpty()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    // FileProvider (used for sharing exported diagnostic logs) ships in
    // androidx.core; declare it explicitly so the class is always present.
    implementation "androidx.core:core-ktx:1.13.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
}

flutter {
    source "../.."
}
