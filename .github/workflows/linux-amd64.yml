name: Linux amd64 musl

on:
  workflow_dispatch:
    inputs:
      build_amd64:
        description: Build amd64 variants
        type: boolean
        default: false
  push:
    branches:
      - master
      - inet6
    paths:
      - 'ppp/**'
      - 'common/**'
      - 'main.cpp'
      - 'resource.h'
      - 'resource.rc'
      - 'glibc_compat.h'
      - 'appsettings.json'
      - 'CMakeLists.txt'
      - 'tools/ci/**'
      - 'linux/**'
      - 'darwin/**'
      - 'windows/**'
      - 'android/**'
      - 'go/**'
      - 'tui/**'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  purge-old-runs:
    name: Purge old workflow runs
    uses: ./.github/workflows/cleanup-old-runs.yml
    permissions:
      contents: read
      actions: write

  build-amd64:
    needs: purge-old-runs
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_amd64 }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - base
          - simd
          - io-uring
          - io-uring-simd
          - tc
          - tc-simd
          - tc-io-uring
          - tc-io-uring-simd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build ${{ matrix.variant }} with musl
        env:
          ARCHITECTURE: amd64
          VARIANT: ${{ matrix.variant }}
        run: |
          docker run --rm \
            -e ARCHITECTURE -e VARIANT \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            alpine:3.21 sh -exc '
              sh tools/ci/prepare-musl-deps.sh /tmp/openppp2-3rd
              sh tools/ci/build-musl.sh "$ARCHITECTURE" "$VARIANT" Release /tmp/openppp2-3rd
              sh tools/ci/test-musl-network.sh
            '
          sudo chown -R "$(id -u):$(id -g)" bin build

      - name: Package artifact
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          suffix="-${VARIANT}"
          if [ "$VARIANT" = base ]; then suffix=""; fi
          package="openppp2-linux-amd64${suffix}"
          mkdir -p "build/${package}"
          cp bin/ppp "build/${package}/ppp"
          cp appsettings.json dns-rules.txt geo-rules.yaml firewall-rules.txt ip.txt ipv6.txt "build/${package}/"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PACKAGE }}
          path: build/${{ env.PACKAGE }}/
          if-no-files-found: error

  build-amd64-tui:
    name: build-amd64-tui-cli
    needs: build-amd64
    if: ${{ needs.build-amd64.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.build_amd64) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download amd64 core release package
        uses: actions/download-artifact@v5
        with:
          name: openppp2-linux-amd64
          path: core-package

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-amd64-tui-${{ hashFiles('tui/Cargo.toml', 'tui/Cargo.lock') }}
          restore-keys: linux-amd64-tui-

      - name: Build Rust TUI and CLI Release
        env:
          PPP_TUI_CORE_PATH: ${{ github.workspace }}/core-package/ppp
        run: |
          font="$(fc-match -f '%{file}' sans | head -n 1)"
          test -f "$font"
          PPP_TUI_CJK_FONT_PATH="$font" cargo build --release --manifest-path tui/Cargo.toml --bins

      - name: Package TUI and CLI release
        run: |
          package="build/openppp2-linux-amd64-tui"
          mkdir -p "$package"
          cp tui/target/release/ppp-tui "$package/ppp-tui"
          cp tui/target/release/ppp-tui-cli "$package/ppp-tui-cli"
          cp core-package/appsettings.json core-package/dns-rules.txt core-package/geo-rules.yaml core-package/firewall-rules.txt core-package/ip.txt core-package/ipv6.txt "$package/"
          chmod +x "$package/ppp-tui" "$package/ppp-tui-cli"

      - name: Upload TUI and CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: openppp2-linux-amd64-tui-cli
          path: build/openppp2-linux-amd64-tui/
          if-no-files-found: error

  build-amd64-debug:
    needs: purge-old-runs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Debug with musl
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            alpine:3.21 sh -exc '
              sh tools/ci/prepare-musl-deps.sh /tmp/openppp2-3rd
              sh tools/ci/build-musl.sh amd64 base Debug /tmp/openppp2-3rd
              sh tools/ci/test-musl-network.sh
            '

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v6
        with:
          name: openppp2-linux-amd64-debug
          path: bin/ppp
          if-no-files-found: error
