name: Nuke all workflow runs

on: workflow_dispatch

jobs:
  nuke:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete ALL completed runs (all branches, all workflows)
        shell: bash
        run: |
          total=0
          for page in $(seq 1 20); do
            echo "--- Page $page ---"
            resp=$(gh api "/repos/picetor/openppp2/actions/runs?per_page=100&page=$page")
            count=$(echo "$resp" | jq '.workflow_runs | length')
            echo "  Runs on this page: $count"
            [ "$count" -eq 0 ] && { echo "  No more runs."; break; }
            ids=$(echo "$resp" | jq -r '.workflow_runs[] | select(.status == "completed") | .id')
            [ -z "$ids" ] && { echo "  No completed runs on this page."; continue; }
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              echo "  DELETE id=$id"
              gh api -X DELETE "/repos/picetor/openppp2/actions/runs/$id" && ((total++))
            done <<< "$ids"
          done
          echo "=========="
          echo "Deleted $total runs total."
