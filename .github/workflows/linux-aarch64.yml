name: Linux aarch64 musl

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - inet6
    paths:
      - 'ppp/**'
      - 'common/**'
      - 'main.cpp'
      - 'resource.h'
      - 'resource.rc'
      - 'glibc_compat.h'
      - 'appsettings.json'
      - 'CMakeLists.txt'
      - 'tools/ci/**'
      - 'linux/**'
      - 'darwin/**'
      - 'windows/**'
      - 'android/**'
      - 'go/**'
      - 'tui/**'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  purge-old-runs:
    name: Purge old workflow runs
    uses: ./.github/workflows/cleanup-old-runs.yml
    permissions:
      contents: read
      actions: write

  build-aarch64:
    needs: purge-old-runs
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        variant:
          - base
          - io-uring
          - tc
          - tc-io-uring

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build ${{ matrix.variant }} with musl
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          docker run --rm \
            -e VARIANT \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            alpine:3.21 sh -exc '
              sh tools/ci/prepare-musl-deps.sh /tmp/openppp2-3rd
              sh tools/ci/build-musl.sh aarch64 "$VARIANT" Release /tmp/openppp2-3rd
              sh tools/ci/test-musl-network.sh
              if [ "$VARIANT" = base ]; then
                core_build="build/openppp2-linux-aarch64-tui-core"
                mkdir -p "$core_build/deps"
                cp bin/libppp-core.a "$core_build/libppp-core.a"
                cp /tmp/openppp2-3rd/boost/stage/lib/*.a "$core_build/deps/"
                cp /tmp/openppp2-3rd/jemalloc/lib/libjemalloc.a "$core_build/deps/"
                cp /tmp/openppp2-3rd/openssl/libssl.a /tmp/openppp2-3rd/openssl/libcrypto.a \
                  /tmp/openppp2-3rd/openssl/libz.a /tmp/openppp2-3rd/openssl/libzstd.a "$core_build/deps/"
                for library in libstdc++.a libgcc.a libgcc_eh.a libatomic.a; do
                  library_path="$(gcc -print-file-name="$library")"
                  if [ -f "$library_path" ]; then cp "$library_path" "$core_build/deps/"; fi
                done
              fi
            '
          sudo chown -R "$(id -u):$(id -g)" bin build

      - name: Package artifact
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          suffix="-${VARIANT}"
          if [ "$VARIANT" = base ]; then suffix=""; fi
          package="openppp2-linux-aarch64${suffix}"
          mkdir -p "build/${package}"
          cp bin/ppp "build/${package}/ppp"
          cp appsettings.json dns-rules.txt geo-rules.yaml firewall-rules.txt ip.txt ipv6.txt "build/${package}/"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PACKAGE }}
          path: build/${{ env.PACKAGE }}/
          if-no-files-found: error

      - name: Upload TUI/CLI core link package
        if: ${{ matrix.variant == 'base' }}
        uses: actions/upload-artifact@v6
        with:
          name: openppp2-linux-aarch64-tui-core
          path: build/openppp2-linux-aarch64-tui-core/
          if-no-files-found: error

  build-aarch64-tui:
    name: build-aarch64-tui-cli
    needs: build-aarch64
    if: ${{ needs.build-aarch64.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download aarch64 core release package
        uses: actions/download-artifact@v5
        with:
          name: openppp2-linux-aarch64
          path: core-package

      - name: Download aarch64 in-process core link package
        uses: actions/download-artifact@v5
        with:
          name: openppp2-linux-aarch64-tui-core
          path: core-build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-aarch64-tui-${{ hashFiles('tui/Cargo.toml', 'tui/Cargo.lock') }}
          restore-keys: linux-aarch64-tui-

      - name: Build Rust TUI and CLI Release
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fontconfig musl-tools
          font="$(fc-match -f '%{file}\n' ':lang=zh' | head -n 1)"
          test -f "$font"
          export PPP_TUI_CORE_LIB="$GITHUB_WORKSPACE/core-build/libppp-core.a"
          export PPP_TUI_CORE_LIB_DIRS="$GITHUB_WORKSPACE/core-build/deps"
          export PPP_TUI_CORE_LIBS="ssl;crypto;jemalloc;zstd;z;boost_system;boost_coroutine;boost_thread;boost_context;boost_regex;boost_filesystem"
          export PPP_TUI_CORE_SYSTEM_LIBS="pthread;dl;m"
          export PPP_TUI_CORE_STATIC_SYSTEM_LIBS="stdc++;gcc;gcc_eh;atomic"
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          PPP_TUI_CJK_FONT_PATH="$font" cargo build --release --target aarch64-unknown-linux-musl --manifest-path tui/Cargo.toml --bins

      - name: Package TUI and CLI release
        run: |
          package="build/openppp2-linux-aarch64-tui"
          mkdir -p "$package"
          cp tui/target/aarch64-unknown-linux-musl/release/ppp-tui "$package/ppp-tui"
          cp tui/target/aarch64-unknown-linux-musl/release/ppp-tui-cli "$package/ppp-tui-cli"
          cp core-package/appsettings.json core-package/dns-rules.txt core-package/geo-rules.yaml core-package/firewall-rules.txt core-package/ip.txt core-package/ipv6.txt "$package/"
          chmod +x "$package/ppp-tui" "$package/ppp-tui-cli"

      - name: Upload TUI and CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: openppp2-linux-aarch64-tui-cli
          path: build/openppp2-linux-aarch64-tui/
          if-no-files-found: error
