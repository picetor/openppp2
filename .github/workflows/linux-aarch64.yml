name: Linux aarch64 musl

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - inet6
    paths:
      - 'ppp/**'
      - 'common/**'
      - 'main.cpp'
      - 'resource.h'
      - 'resource.rc'
      - 'glibc_compat.h'
      - 'appsettings.json'
      - 'CMakeLists.txt'
      - 'tools/ci/**'
      - 'linux/**'
      - 'darwin/**'
      - 'windows/**'
      - 'android/**'
      - 'go/**'
      - 'tui/**'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        variant:
          - base
          - io-uring
          - tc
          - tc-io-uring

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build ${{ matrix.variant }} with musl
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          docker run --rm \
            -e VARIANT \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            alpine:3.21 sh -exc '
              sh tools/ci/prepare-musl-deps.sh /tmp/openppp2-3rd
              sh tools/ci/build-musl.sh aarch64 "$VARIANT" Release /tmp/openppp2-3rd
              sh tools/ci/test-musl-network.sh
            '
          sudo chown -R "$(id -u):$(id -g)" bin build

      - name: Install Rust toolchain for release TUI
        if: matrix.variant == 'base'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust TUI release build
        if: matrix.variant == 'base'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-aarch64-tui-${{ hashFiles('tui/Cargo.toml', 'tui/Cargo.lock') }}
          restore-keys: linux-aarch64-tui-

      - name: Build Rust TUI release
        if: matrix.variant == 'base'
        env:
          PPP_TUI_CORE_PATH: ${{ github.workspace }}/bin/ppp
        run: |
          font="$(fc-match -f '%{file}' sans | head -n 1)"
          test -f "$font"
          PPP_TUI_CJK_FONT_PATH="$font" cargo build --release --manifest-path tui/Cargo.toml --bins

      - name: Package artifact
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          suffix="-${VARIANT}"
          if [ "$VARIANT" = base ]; then suffix=""; fi
          package="openppp2-linux-aarch64${suffix}"
          mkdir -p "build/${package}"
          cp bin/ppp "build/${package}/ppp"
          cp appsettings.json dns-rules.txt geo-rules.yaml firewall-rules.txt ip.txt ipv6.txt "build/${package}/"
          if [ "$VARIANT" = base ]; then
            cp tui/target/release/ppp-tui "build/${package}/ppp-tui"
            cp tui/target/release/ppp-tui-cli "build/${package}/ppp-tui-cli"
          fi
          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PACKAGE }}
          path: build/${{ env.PACKAGE }}/
          if-no-files-found: error

  build-aarch64-debug:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Debug with musl
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            alpine:3.21 sh -exc '
              sh tools/ci/prepare-musl-deps.sh /tmp/openppp2-3rd
              sh tools/ci/build-musl.sh aarch64 base Debug /tmp/openppp2-3rd
              sh tools/ci/test-musl-network.sh
            '

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v6
        with:
          name: openppp2-linux-aarch64-debug
          path: bin/ppp
          if-no-files-found: error
