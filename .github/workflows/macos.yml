# Description: Build openppp2 macOS - arm64 + amd64 variants using prebuilt 3rd-party libs.
# Author     : picetor
# Date-Time  : 2026/06/24

name: macOS

on:
  workflow_dispatch:      # 手动触发
    inputs:
      build_macos:
        description: 'Build macOS variants'
        type: boolean
        default: false
  push:                   # 推送自动触发（仅构建相关文件变更）
    branches:
      - master
      - inet6
    paths:
      - 'ppp/**'
      - 'common/**'
      - 'main.cpp'
      - 'resource.h'
      - 'resource.rc'
      - 'glibc_compat.h'
      - 'appsettings.json'
      - 'CMakeLists.txt'
      - 'tools/ci/**'
      - 'linux/**'
      - 'darwin/**'
      - 'windows/**'
      - 'android/**'
      - 'go/**'
      - 'tui/**'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  purge-old-runs:
    name: Purge old workflow runs
    uses: ./.github/workflows/cleanup-old-runs.yml
    permissions:
      contents: read
      actions: write

  build-macos:
    needs: purge-old-runs
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: arm64
            arch: arm64
            triple: darwin-arm64
            rust_target: aarch64-apple-darwin
            repo: Liz-Nozomi/openppp2-macos-arm64-environment
          - name: amd64
            arch: x86_64
            triple: darwin-amd64
            rust_target: x86_64-apple-darwin
            repo: liulilittle/openppp2-macos-amd64-environment

    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download prebuilt 3rd-party libraries (macOS ${{ matrix.platform.name }})
        run: |
          git clone https://github.com/${{ matrix.platform.repo }}.git 3rd
          echo "3rd-party libraries downloaded"
          ls -la 3rd/ || echo "WARNING: 3rd dir empty"

      - name: Build openppp2 (macOS ${{ matrix.platform.name }})
        id: build
        run: |
          NCPU=$(sysctl -n hw.physicalcpu)
          TS=$(date '+%Y%m%d_%H%M')
          ARCH="${{ matrix.platform.arch }}"
          TRIPLE="${{ matrix.platform.triple }}"

          echo "=== Building macOS ${TRIPLE} ==="
          echo "ncpu=${NCPU}"

          # ARM64 doesn't support x86 AES/SSE SIMD instructions
          SIMD_FLAG=""
          if [ "${ARCH}" = "arm64" ]; then
            SIMD_FLAG="-DNOT_HAVE_SIMD=ON"
            echo "ARM64 detected: disabling SIMD (-maes -msse2 -mpclmul not supported)"
          fi

          # Build
          rm -rf build && mkdir build && cd build
          export MACOSX_DEPLOYMENT_TARGET=11.0
          export CXXFLAGS="-mmacosx-version-min=11.0"
          export CFLAGS="-mmacosx-version-min=11.0"
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${ARCH} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DTHIRD_PARTY_LIBRARY_DIR=${GITHUB_WORKSPACE}/3rd \
            ${SIMD_FLAG}
          make -j ${NCPU}

          # Check binary
          if [ ! -f "../bin/ppp" ]; then
            echo "ERROR: bin/ppp not found!"
            find .. -name ppp -type f 2>/dev/null
            exit 1
          fi

          # Name output
          ZIP_NAME="openppp2-${TRIPLE}"
          ARTIFACT_NAME="${ZIP_NAME}_${TS}"
          cp ../bin/ppp "${ARTIFACT_NAME}"
          file "${ARTIFACT_NAME}"

          core_build="../build/openppp2-macos-${{ matrix.platform.name }}-tui-core"
          mkdir -p "${core_build}/deps"
          cp ../bin/libppp-core.a "${core_build}/libppp-core.a"
          cp ../3rd/boost/stage/lib/*.a "${core_build}/deps/"
          cp ../3rd/jemalloc/lib/libjemalloc.a "${core_build}/deps/"
          cp ../3rd/openssl/libssl.a ../3rd/openssl/libcrypto.a "${core_build}/deps/"

      - name: Package release artifact
        run: |
          ZIP_NAME="openppp2-${{ matrix.platform.triple }}"
          PKG_DIR="${ZIP_NAME}"
          echo "=== Packaging ${ZIP_NAME}.zip ==="
          mkdir -p "build/${PKG_DIR}"
          cp bin/ppp "build/${PKG_DIR}/ppp"
          cp "${GITHUB_WORKSPACE}/appsettings.json" "build/${PKG_DIR}/"
          cp "${GITHUB_WORKSPACE}/dns-rules.txt" "build/${PKG_DIR}/"
          cp "${GITHUB_WORKSPACE}/geo-rules.yaml" "build/${PKG_DIR}/"
          cp "${GITHUB_WORKSPACE}/firewall-rules.txt" "build/${PKG_DIR}/"
          cp "${GITHUB_WORKSPACE}/ip.txt" "build/${PKG_DIR}/"
          cp "${GITHUB_WORKSPACE}/ipv6.txt" "build/${PKG_DIR}/"
          echo "PKG_DIR=${PKG_DIR}" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: openppp2-macos-${{ matrix.platform.name }}
          path: build/${{ env.PKG_DIR }}/
          if-no-files-found: error

      - name: Upload TUI/CLI core link package
        uses: actions/upload-artifact@v6
        with:
          name: openppp2-macos-${{ matrix.platform.name }}-tui-core
          path: build/openppp2-macos-${{ matrix.platform.name }}-tui-core/
          if-no-files-found: error

  build-macos-tui:
    name: build-macos-tui-cli (${{ matrix.platform.name }})
    needs: build-macos
    if: ${{ needs.build-macos.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.build_macos) }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: arm64
            triple: darwin-arm64
            rust_target: aarch64-apple-darwin
          - name: amd64
            triple: darwin-amd64
            rust_target: x86_64-apple-darwin

    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download ${{ matrix.platform.name }} core release package
        uses: actions/download-artifact@v5
        with:
          name: openppp2-macos-${{ matrix.platform.name }}
          path: core-package

      - name: Download ${{ matrix.platform.name }} in-process core link package
        uses: actions/download-artifact@v5
        with:
          name: openppp2-macos-${{ matrix.platform.name }}-tui-core
          path: core-build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-${{ matrix.platform.rust_target }}-tui-${{ hashFiles('tui/Cargo.toml', 'tui/Cargo.lock') }}
          restore-keys: macos-${{ matrix.platform.rust_target }}-tui-

      - name: Build Rust TUI and CLI Release
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          font=""
          for candidate in \
            /System/Library/Fonts/PingFang.ttc \
            /System/Library/Fonts/STHeiti Light.ttc \
            /System/Library/Fonts/Hiragino Sans GB.ttc \
            /Library/Fonts/Arial Unicode.ttf; do
            if [ -f "$candidate" ]; then
              font="$candidate"
              break
            fi
          done
          if [ -z "$font" ] && command -v fc-match >/dev/null 2>&1; then
            font="$(fc-match -f '%{file}\n' ':lang=zh' | head -n 1)"
          fi
          if [ -z "$font" ] || [ ! -f "$font" ]; then
            echo "No Chinese-capable font found for PPP_TUI_CJK_FONT_PATH"
            exit 1
          fi
          export PPP_TUI_CORE_LIB="$GITHUB_WORKSPACE/core-build/libppp-core.a"
          export PPP_TUI_CORE_LIB_DIRS="$GITHUB_WORKSPACE/core-build/deps"
          export PPP_TUI_CORE_LIBS="ssl;crypto;jemalloc;boost_system;boost_coroutine;boost_thread;boost_context;boost_regex;boost_filesystem"
          export PPP_TUI_CORE_SYSTEM_LIBS="c++;pthread;dl"
          PPP_TUI_CJK_FONT_PATH="$font" cargo build --release --target "${{ matrix.platform.rust_target }}" --manifest-path tui/Cargo.toml --bins

      - name: Package TUI and CLI release
        run: |
          package="build/openppp2-${{ matrix.platform.triple }}-tui"
          mkdir -p "$package"
          cp "tui/target/${{ matrix.platform.rust_target }}/release/ppp-tui" "$package/ppp-tui"
          cp "tui/target/${{ matrix.platform.rust_target }}/release/ppp-tui-cli" "$package/ppp-tui-cli"
          cp core-package/appsettings.json core-package/dns-rules.txt core-package/geo-rules.yaml core-package/firewall-rules.txt core-package/ip.txt core-package/ipv6.txt "$package/"

      - name: Upload TUI and CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: openppp2-macos-${{ matrix.platform.name }}-tui-cli
          path: build/openppp2-${{ matrix.platform.triple }}-tui/
          if-no-files-found: error
