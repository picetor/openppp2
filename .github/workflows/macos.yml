# Description: Build openppp2 macOS - arm64 + amd64 variants using prebuilt 3rd-party libs.
# Author     : picetor
# Date-Time  : 2026/06/24

name: macOS

on:
  workflow_dispatch:      # 手动触发
    inputs:
      build_macos:
        description: 'Build macOS variants'
        type: boolean
        default: false
  push:                   # 推送自动触发（仅构建相关文件变更）
    branches:
      - master
      - inet6
    paths:
      - 'ppp/**'
      - 'common/**'
      - 'main.cpp'
      - 'resource.h'
      - 'resource.rc'
      - 'glibc_compat.h'
      - 'appsettings.json'
      - 'CMakeLists.txt'
      - 'tools/ci/**'
      - 'linux/**'
      - 'darwin/**'
      - 'windows/**'
      - 'android/**'
      - 'go/**'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  purge-old-runs:
    name: Purge old workflow runs
    uses: ./.github/workflows/cleanup-old-runs.yml
    permissions:
      contents: read
      actions: write

  build-macos:
    needs: purge-old-runs
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: arm64
            arch: arm64
            triple: darwin-arm64
            rust_target: aarch64-apple-darwin
            repo: Liz-Nozomi/openppp2-macos-arm64-environment
          - name: amd64
            arch: x86_64
            triple: darwin-amd64
            rust_target: x86_64-apple-darwin
            repo: liulilittle/openppp2-macos-amd64-environment

    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download prebuilt 3rd-party libraries (macOS ${{ matrix.platform.name }})
        run: |
          git clone https://github.com/${{ matrix.platform.repo }}.git 3rd
          echo "3rd-party libraries downloaded"
          ls -la 3rd/ || echo "WARNING: 3rd dir empty"

      - name: Build openppp2 (macOS ${{ matrix.platform.name }})
        id: build
        run: |
          NCPU=$(sysctl -n hw.physicalcpu)
          TS=$(date '+%Y%m%d_%H%M')
          ARCH="${{ matrix.platform.arch }}"
          TRIPLE="${{ matrix.platform.triple }}"

          echo "=== Building macOS ${TRIPLE} ==="
          echo "ncpu=${NCPU}"

          # ARM64 doesn't support x86 AES/SSE SIMD instructions
          SIMD_FLAG=""
          if [ "${ARCH}" = "arm64" ]; then
            SIMD_FLAG="-DNOT_HAVE_SIMD=ON"
            echo "ARM64 detected: disabling SIMD (-maes -msse2 -mpclmul not supported)"
          fi

          # Build
          rm -rf build && mkdir build && cd build
          export MACOSX_DEPLOYMENT_TARGET=11.0
          export CXXFLAGS="-mmacosx-version-min=11.0"
          export CFLAGS="-mmacosx-version-min=11.0"
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${ARCH} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DTHIRD_PARTY_LIBRARY_DIR=${GITHUB_WORKSPACE}/3rd \
            ${SIMD_FLAG}
          make -j ${NCPU}

          # Check binary
          if [ ! -f "../bin/ppp" ]; then
            echo "ERROR: bin/ppp not found!"
            find .. -name ppp -type f 2>/dev/null
            exit 1
          fi

          # Name output
          ZIP_NAME="openppp2-${TRIPLE}"
          ARTIFACT_NAME="${ZIP_NAME}_${TS}"
          cp ../bin/ppp "${ARTIFACT_NAME}"
          file "${ARTIFACT_NAME}"

      - name: Package release artifact
        run: |
          ZIP_NAME="openppp2-${{ matrix.platform.triple }}"
          PKG_DIR="${ZIP_NAME}"
          echo "=== Packaging ${ZIP_NAME}.zip ==="
          mkdir -p "build/${PKG_DIR}"
          cp bin/ppp "build/${PKG_DIR}/ppp"
          cp "${GITHUB_WORKSPACE}/appsettings.json" "build/${PKG_DIR}/"
          cp "${GITHUB_WORKSPACE}/dns-rules.txt" "build/${PKG_DIR}/"
          cp "${GITHUB_WORKSPACE}/geo-rules.yaml" "build/${PKG_DIR}/"
          cp "${GITHUB_WORKSPACE}/firewall-rules.txt" "build/${PKG_DIR}/"
          cp "${GITHUB_WORKSPACE}/ip.txt" "build/${PKG_DIR}/"
          cp "${GITHUB_WORKSPACE}/ipv6.txt" "build/${PKG_DIR}/"
          echo "PKG_DIR=${PKG_DIR}" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: openppp2-macos-${{ matrix.platform.name }}
          path: build/${{ env.PKG_DIR }}/
          if-no-files-found: error
