name: Build openppp2 (Linux aarch64 musl Debug)

on:
  push:
    branches: [inet6, ucp]
    paths:
      - 'common/**'
      - 'ppp/**'
      - 'linux/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'main.cpp'
      - 'glibc_compat.h'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-aarch64-debug:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout UCP library (sibling, Track B ucp:// tunnel)
        run: git clone --depth 1 https://github.com/picetor/ucp.git "${{ runner.workspace }}/ucp"

      - name: Build Debug with musl
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -v "$GITHUB_WORKSPACE/../ucp:/ucp" \
            alpine:3.21 sh -exc '
              sh tools/ci/prepare-musl-deps.sh /tmp/openppp2-3rd
              sh tools/ci/build-musl.sh aarch64 base Debug /tmp/openppp2-3rd
              sh tools/ci/test-musl-network.sh
            '

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v6
        with:
          name: openppp2-linux-aarch64-debug
          path: bin/ppp
          if-no-files-found: error