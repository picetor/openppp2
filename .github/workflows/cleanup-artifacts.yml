# Keep only the last 10 build artifacts per artifact name.
# Runs on every push and on manual trigger.
name: Cleanup old artifacts

on:
  push:                       # run on every push
  workflow_dispatch:          # manual trigger

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup artifacts (keep last 10 per name)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Fetching artifacts..."
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '
            .artifacts
            | sort_by(.created_at) | reverse
            | group_by(.name)
            | .[]
            | .[10:]
            | .[] | "\(.id) \(.name)"' | while read -r id name; do
            echo "  DELETE artifact \"$name\" (id=$id)"
            gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
          echo "Cleanup complete."
