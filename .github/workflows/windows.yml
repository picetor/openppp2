# Description: Build openppp2 Windows (MSVC) - Release workflow
# Author     : picetor
# Date-Time  : 2026/06/24

name: Windows

on:
  workflow_dispatch:      # 手动触发
  push:                   # 推送自动触发（仅构建相关文件变更）
    branches:
      - master
      - inet6
    paths:
      - 'ppp/**'
      - 'common/**'
      - 'main.cpp'
      - 'resource.h'
      - 'resource.rc'
      - 'glibc_compat.h'
      - 'appsettings.json'
      - 'CMakeLists.txt'
      - 'tools/ci/**'
      - 'linux/**'
      - 'darwin/**'
      - 'windows/**'
      - 'android/**'
      - 'go/**'
      - 'tui/**'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  purge-old-runs:
    name: Purge old workflow runs
    uses: ./.github/workflows/cleanup-old-runs.yml
    permissions:
      contents: read
      actions: write

  build-windows:
    needs: purge-old-runs
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            vcpkg_triplet: x64-windows-static
            msbuild_platform: x64
            rust_target: x86_64-pc-windows-msvc
          - name: i386
            vcpkg_triplet: x86-windows-static
            msbuild_platform: Win32
            rust_target: i686-pc-windows-msvc
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup vcpkg
        run: |
          cd ${{ github.workspace }}
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $env:GITHUB_ENV
          echo "${{ github.workspace }}/vcpkg" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Cache vcpkg packages
        id: cache-vcpkg
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/vcpkg/packages
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ matrix.platform.vcpkg_triplet }}-boost1.91-boost-context-openssl3-jemalloc
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.platform.vcpkg_triplet }}-

      - name: Install dependencies via vcpkg
        run: |
          cd ${{ github.workspace }}/vcpkg
          .\vcpkg install `
            boost-asio boost-beast boost-json boost-program-options boost-system boost-thread `
            boost-lockfree boost-uuid boost-context boost-coroutine boost-filesystem boost-stacktrace `
            openssl jemalloc `
            --triplet ${{ matrix.platform.vcpkg_triplet }} `
            --x-install-root=${{ github.workspace }}\..\vcpkg_installed

      - name: Save vcpkg packages
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/vcpkg/packages
            ${{ github.workspace }}/vcpkg/downloads
          key: ${{ steps.cache-vcpkg.outputs.cache-primary-key }}

      - name: Download cacert.pem
        run: |
          curl -sL -o ${{ github.workspace }}/cacert.pem https://curl.se/ca/cacert.pem
          if (Test-Path "${{ github.workspace }}/cacert.pem") {
            Write-Output "cacert.pem downloaded successfully"
          } else {
            Write-Error "Failed to download cacert.pem"
            exit 1
          }

      - name: Setup MSBuild path
        run: |
          # Try vswhere first (most reliable on GitHub Actions)
          $msbuildPath = $null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $msbuildPath = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
            if ($msbuildPath) {
              Write-Output "Found MSBuild via vswhere: $msbuildPath"
            }
          }
          # Fallback: check standard locations
          if (-not $msbuildPath) {
            $searchDirs = @(
              "${env:ProgramFiles}\Microsoft Visual Studio",
              "${env:ProgramFiles(x86)}\Microsoft Visual Studio"
            )
            foreach ($dir in $searchDirs) {
              if (Test-Path $dir) {
                $found = Get-ChildItem -Path $dir -Recurse -Filter "MSBuild.exe" -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match 'Bin\\MSBuild\.exe$' } |
                  Select-Object -First 1 -ExpandProperty FullName
                if ($found) {
                  $msbuildPath = $found
                  Write-Output "Found MSBuild via file search: $msbuildPath"
                  break
                }
              }
            }
          }
          if (-not $msbuildPath) {
            Write-Error "MSBuild not found!"
            exit 1
          }
          # Add to PATH for subsequent steps
          $parent = Split-Path $msbuildPath -Parent
          echo "$parent" | Out-File -FilePath $env:GITHUB_PATH -Append
          # Verify using full path (Get-Command won't work in same step after GITHUB_PATH)
          Write-Output "MSBuild: $msbuildPath"
          & $msbuildPath /version

      - name: Build Windows
        id: build
        run: |
          $TS = Get-Date -Format "yyyyMMdd_HHmm"

          Write-Output "=== Preparing vcpkg headers and libraries ==="

          # --x-install-root provides the installed tree, but the cached package tree
          # is the reliable source for headers and static libraries. Copy files one by
          # one so a failed copy is visible instead of being hidden by a wildcard copy.
          $vcpkgInstalled = "${{ github.workspace }}\..\vcpkg_installed\${{ matrix.platform.vcpkg_triplet }}"
          $vcpkgPackages = "${{ github.workspace }}\vcpkg\packages"
          $includeDestination = Join-Path $vcpkgInstalled "include"
          $libDestination = Join-Path $vcpkgInstalled "lib"
          New-Item -ItemType Directory -Path $includeDestination -Force | Out-Null
          New-Item -ItemType Directory -Path $libDestination -Force | Out-Null

          $vcpkgPackageDirectories = @(Get-ChildItem -LiteralPath $vcpkgPackages -Directory)
          if ($vcpkgPackageDirectories.Count -eq 0) {
            throw "No vcpkg package directories found under $vcpkgPackages"
          }

          $headerFilesCopied = 0
          $headerFilesReused = 0
          $libraryFilesCopied = 0
          $libraryFilesReused = 0
          foreach ($package in $vcpkgPackageDirectories) {
            $pkgInclude = Join-Path $package.FullName "include"
            if (Test-Path -LiteralPath $pkgInclude) {
              Write-Output "  Copying headers from $($package.Name)..."
              $includeFiles = @(Get-ChildItem -LiteralPath $pkgInclude -File -Recurse)
              foreach ($file in $includeFiles) {
                $relativePath = $file.FullName.Substring($pkgInclude.Length).TrimStart('\')
                $destination = Join-Path $includeDestination $relativePath
                $destinationParent = Split-Path -Parent $destination
                New-Item -ItemType Directory -Path $destinationParent -Force | Out-Null
                if (Test-Path -LiteralPath $destination) {
                  # vcpkg may materialize package files as hard links in the
                  # install tree. Do not copy an existing file onto itself.
                  $headerFilesReused++
                } else {
                  Copy-Item -LiteralPath $file.FullName -Destination $destination -Force -ErrorAction Stop
                  $headerFilesCopied++
                }
              }
            }

            # Only copy the package's release lib directory. Do not recurse into
            # debug/lib, because those files can have the same names and overwrite
            # the release libraries needed by the Release build.
            $pkgLib = Join-Path $package.FullName "lib"
            if (Test-Path -LiteralPath $pkgLib) {
              $libraryFiles = @(Get-ChildItem -LiteralPath $pkgLib -File -Filter '*.lib')
              if ($libraryFiles.Count -gt 0) {
                Write-Output "  Copying $($libraryFiles.Count) release libs from $($package.Name)..."
              }
              foreach ($file in $libraryFiles) {
                $destination = Join-Path $libDestination $file.Name
                if (Test-Path -LiteralPath $destination) {
                  $libraryFilesReused++
                } else {
                  Copy-Item -LiteralPath $file.FullName -Destination $destination -Force -ErrorAction Stop
                  $libraryFilesCopied++
                }
              }
            }
          }

          Write-Output "Copied $headerFilesCopied header files and reused $headerFilesReused existing headers"
          Write-Output "Copied $libraryFilesCopied release library files and reused $libraryFilesReused existing libraries"
          if (($libraryFilesCopied + $libraryFilesReused) -eq 0) {
            Write-Output "Package library files found under ${vcpkgPackages}:"
            Get-ChildItem -LiteralPath $vcpkgPackages -Recurse -File -Filter '*.lib' -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "No release vcpkg libraries were copied"
          }

          $architectureSuffix = if ('${{ matrix.platform.msbuild_platform }}' -eq 'x64') { 'x64' } else { 'x32' }
          $boostComponents = @('context', 'coroutine', 'thread', 'filesystem')
          $expectedLibraries = @()
          foreach ($component in $boostComponents) {
            $expectedName = "boost_${component}-vc145-mt-$architectureSuffix-1_91.lib"
            $expectedPath = Join-Path $libDestination $expectedName
            if (-not (Test-Path -LiteralPath $expectedPath)) {
              $candidates = @(Get-ChildItem -LiteralPath $libDestination -File -Filter "boost_${component}-*.lib")
              if ($candidates.Count -eq 1) {
                # The MSVC toolset suffix is versioned by vcpkg. The project links
                # the vc145 names, so normalize a single compatible package output.
                Write-Output "  Normalizing $($candidates[0].Name) to $expectedName"
                Copy-Item -LiteralPath $candidates[0].FullName -Destination $expectedPath -Force -ErrorAction Stop
              }
            }
            $expectedLibraries += $expectedName
          }

          foreach ($library in $expectedLibraries) {
            $libraryPath = Join-Path $libDestination $library
            if (-not (Test-Path -LiteralPath $libraryPath)) {
              Write-Error "Required vcpkg library is unavailable: $libraryPath"
              Write-Output "Release libraries staged in ${libDestination}:"
              Get-ChildItem -LiteralPath $libDestination -File -Filter '*.lib' -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty Name
              exit 1
            }
          }
          Write-Output "=== Verified Boost libraries in $libDestination ==="
          $expectedLibraries | ForEach-Object { Write-Output "  $_" }
          Write-Output "=== Header/lib preparation complete ==="

          # Create placeholder files for missing items
          if (-not (Test-Path "${{ github.workspace }}\starrylink.net.key")) {
            "# placeholder" | Out-File -FilePath "${{ github.workspace }}\starrylink.net.key"
          }
          if (-not (Test-Path "${{ github.workspace }}\starrylink.net.pem")) {
            "# placeholder" | Out-File -FilePath "${{ github.workspace }}\starrylink.net.pem"
          }

          Write-Output "=== Building Windows ${{ matrix.platform.msbuild_platform }} (Release) ==="

          # Build Release
          msbuild ppp.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.platform.msbuild_platform }} `
            "/t:Clean;Build" `
            /p:VcpkgEnableManifest=false `
            /m

          if ($LASTEXITCODE -ne 0) {
            Write-Error "MSBuild Release failed with exit code $LASTEXITCODE"
            exit 1
          }

          # Find the Release executable
          $releaseExe = "${{ matrix.platform.msbuild_platform }}\Release\ppp.exe"
          if (-not (Test-Path $releaseExe)) {
            $releaseExe = "Release\ppp.exe"
          }
          if (-not (Test-Path $releaseExe)) {
            Write-Error "Release ppp.exe not found!"
            Get-ChildItem -Recurse -Filter "ppp.exe" | Select-Object FullName
            exit 1
          }

          Write-Output "Found Release ppp.exe at: $releaseExe"

          # Create package directory with all supporting files (like Linux release)
          $PackageDir = "openppp2-windows-${{ matrix.platform.name }}"
          if (Test-Path $PackageDir) { Remove-Item -Recurse -Force $PackageDir }
          New-Item -ItemType Directory -Path $PackageDir -Force | Out-Null

          Copy-Item $releaseExe "$PackageDir\ppp.exe"
          Copy-Item "${{ github.workspace }}\appsettings.json" "$PackageDir\"
          Copy-Item "${{ github.workspace }}\dns-rules.txt" "$PackageDir\"
          Copy-Item "${{ github.workspace }}\geo-rules.yaml" "$PackageDir\"
          Copy-Item "${{ github.workspace }}\firewall-rules.txt" "$PackageDir\"
          Copy-Item "${{ github.workspace }}\ip.txt" "$PackageDir\"
          Copy-Item "${{ github.workspace }}\ipv6.txt" "$PackageDir\"
          Copy-Item -Recurse "${{ github.workspace }}\Driver" "$PackageDir\Driver"

          $ReleaseArtifactName = "${PackageDir}"

          echo "ARTIFACT_NAME=$ReleaseArtifactName" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "status=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Release artifact
        uses: actions/upload-artifact@v6
        with:
          name: openppp2-windows-${{ matrix.platform.name }}
          path: ${{ github.workspace }}/openppp2-windows-${{ matrix.platform.name }}
          if-no-files-found: error

  build-windows-tui:
    name: build-windows-tui-cli (${{ matrix.platform.name }})
    needs: build-windows
    if: ${{ needs.build-windows.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            rust_target: x86_64-pc-windows-msvc
          - name: i386
            rust_target: i686-pc-windows-msvc

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download ${{ matrix.platform.name }} core release package
        uses: actions/download-artifact@v5
        with:
          name: openppp2-windows-${{ matrix.platform.name }}
          path: core-package

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
          key: windows-${{ matrix.platform.rust_target }}-tui-${{ hashFiles('tui/Cargo.toml', 'tui/Cargo.lock') }}
          restore-keys: windows-${{ matrix.platform.rust_target }}-tui-

      - name: Build Rust TUI and CLI Release
        run: |
          $corePath = Join-Path "${{ github.workspace }}" 'core-package\ppp.exe'
          if (-not (Test-Path -LiteralPath $corePath)) {
            throw "Release core not found: $corePath"
          }
          $font = Get-ChildItem -LiteralPath "$env:WINDIR\Fonts" -File -ErrorAction Stop |
            Where-Object { $_.Extension -in '.ttf', '.otf', '.ttc' } |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($font) -or -not (Test-Path -LiteralPath $font)) {
            throw 'No system font found for PPP_TUI_CJK_FONT_PATH'
          }
          $env:PPP_TUI_CORE_PATH = (Resolve-Path -LiteralPath $corePath).Path
          $env:PPP_TUI_CJK_FONT_PATH = $font
          cargo build --release --target "${{ matrix.platform.rust_target }}" --manifest-path tui/Cargo.toml --bins

      - name: Package TUI and CLI release
        run: |
          $packageDir = "${{ github.workspace }}\openppp2-windows-${{ matrix.platform.name }}-tui"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          $tuiOutput = Join-Path "${{ github.workspace }}" "tui\target\${{ matrix.platform.rust_target }}\release"
          Copy-Item (Join-Path $tuiOutput 'ppp-tui.exe') (Join-Path $packageDir 'ppp-tui.exe')
          Copy-Item (Join-Path $tuiOutput 'ppp-tui-cli.exe') (Join-Path $packageDir 'ppp-tui-cli.exe')
          Copy-Item "${{ github.workspace }}\core-package\appsettings.json" $packageDir
          Copy-Item "${{ github.workspace }}\core-package\dns-rules.txt" $packageDir
          Copy-Item "${{ github.workspace }}\core-package\geo-rules.yaml" $packageDir
          Copy-Item "${{ github.workspace }}\core-package\firewall-rules.txt" $packageDir
          Copy-Item "${{ github.workspace }}\core-package\ip.txt" $packageDir
          Copy-Item "${{ github.workspace }}\core-package\ipv6.txt" $packageDir
          $driver = "${{ github.workspace }}\core-package\Driver"
          if (Test-Path -LiteralPath $driver) {
            Copy-Item -Recurse $driver (Join-Path $packageDir 'Driver')
          }

      - name: Upload TUI and CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: openppp2-windows-${{ matrix.platform.name }}-tui-cli
          path: ${{ github.workspace }}/openppp2-windows-${{ matrix.platform.name }}-tui
          if-no-files-found: error
