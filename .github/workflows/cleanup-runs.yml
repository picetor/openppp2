name: Cleanup old workflow runs

on:
  push:
    branches: [inet6]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cleanup old workflow runs (keep last 40 per workflow)
        shell: bash
        run: |
          WORKFLOWS=(
            "Build openppp2 (Linux amd64)"
            "Build openppp2 (Linux amd64 Debug)"
            "Build openppp2 (Linux aarch64)"
            "Build openppp2 (Linux aarch64 Debug)"
            "Build openppp2 (Windows)"
            "Build openppp2 (Windows Debug)"
            "Build openppp2 (macOS)"
            "Build openppp2 (macOS Debug)"
          )

          KEEP=0

          for WF in "${WORKFLOWS[@]}"; do
            echo "=== $WF ==="
            all_ids=()
            all_nums=()
            # Paginate through all completed runs
            page=1
            while :; do
              resp=$(gh api "/repos/${{ github.repository }}/actions/runs?workflow=$(echo "$WF" | sed 's/ /%20/g')&per_page=100&page=$page" 2>/dev/null)
              items=$(echo "$resp" | jq -c '.workflow_runs[] | select(.status == "completed") | {id: .id, number: .run_number}' 2>/dev/null)
              [ -z "$items" ] && break
              while IFS= read -r item; do
                [ -z "$item" ] && continue
                all_ids+=("$(echo "$item" | jq -r '.id')")
                all_nums+=("$(echo "$item" | jq -r '.number')")
              done <<< "$items"
              page=$((page + 1))
            done

            total=${#all_ids[@]}
            echo "  Total runs: $total"

            [ "$total" -le "$KEEP" ] && { echo "  <= $KEEP runs, nothing to clean."; continue; }

            # Sort by run_number ascending, keep last KEEP
            mapfile -t sorted < <(for i in "${!all_ids[@]}"; do echo "${all_nums[$i]}:${all_ids[$i]}"; done | sort -t: -k1 -n)
            to_delete=("${sorted[@]:0:$((total - KEEP))}")

            for entry in "${to_delete[@]}"; do
              num="${entry%%:*}"
              id="${entry#*:}"
              echo "  DELETE run #$num (id=$id)"
              gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/$id" || echo "    (DELETE failed)"
            done
            echo "  Deleted ${#to_delete[@]} runs, kept ${KEEP}."
          done
          echo "All workflows cleaned."
        env:
          GH_TOKEN: ${{ github.token }}
