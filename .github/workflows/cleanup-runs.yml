name: Cleanup old workflow runs

on:
  push:
    branches: [inet6]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old workflow runs (keep last 40 per workflow)
        shell: bash
        run: |
          WORKFLOWS=(
            "Build openppp2 (Linux amd64)"
            "Build openppp2 (Linux amd64 Debug)"
            "Build openppp2 (Linux aarch64)"
            "Build openppp2 (Linux aarch64 Debug)"
            "Build openppp2 (Windows)"
            "Build openppp2 (Windows Debug)"
            "Build openppp2 (macOS)"
            "Build openppp2 (macOS Debug)"
          )

          KEEP=40

          for WF in "${WORKFLOWS[@]}"; do
            echo "=== $WF ==="
            page=1
            all_ids=()
            all_nums=()
            while :; do
              resp=$(gh api "/repos/${{ github.repository }}/actions/runs?workflow=$(echo "$WF" | sed 's/ /%20/g')&branch=${{ github.ref_name }}&per_page=100&page=$page" 2>/dev/null)
              items=$(echo "$resp" | jq -c '.workflow_runs[] | {id: .id, number: .run_number}' 2>/dev/null)
              count=$(echo "$items" | grep -c . 2>/dev/null) || count=0
              [ "$count" -eq 0 ] && break
              while IFS= read -r item; do
                id=$(echo "$item" | jq -r '.id')
                num=$(echo "$item" | jq -r '.number')
                all_ids+=("$id")
                all_nums+=("$num")
              done <<< "$items"
              page=$((page + 1))
            done

            total=${#all_ids[@]}
            echo "  Total runs: $total"

            if [ "$total" -le "$KEEP" ]; then
              echo "  <= $KEEP runs, nothing to clean."
              continue
            fi

            combined=()
            for i in "${!all_ids[@]}"; do
              combined+=("${all_nums[$i]}:${all_ids[$i]}")
            done
            IFS=$'\n' sorted=($(sort -t: -k1 -n <<< "${combined[*]}")); unset IFS
            to_delete=("${sorted[@]:0:$((total - KEEP))}")

            for entry in "${to_delete[@]}"; do
              num="${entry%%:*}"
              id="${entry#*:}"
              echo "  DELETE run #$num (id=$id)"
              gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/$id" --silent 2>/dev/null || echo "    (failed, may be in progress)"
            done
            echo "  Deleted ${#to_delete[@]} runs, kept ${KEEP}."
          done
          echo "All workflows cleaned."
        env:
          GH_TOKEN: ${{ github.token }}
