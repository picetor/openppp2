name: Build openppp2 (Linux amd64 musl)

on:
  push:
    branches: [inet6]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.txt'
      - '**.json'
  workflow_dispatch:
    inputs:
      build_amd64:
        description: Build amd64 variants
        type: boolean
        default: false

jobs:
  build-amd64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_amd64 }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - base
          - simd
          - io-uring
          - io-uring-simd
          - tc
          - tc-simd
          - tc-io-uring
          - tc-io-uring-simd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build ${{ matrix.variant }} with musl
        env:
          ARCHITECTURE: amd64
          VARIANT: ${{ matrix.variant }}
        run: |
          docker run --rm \
            -e ARCHITECTURE -e VARIANT \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            alpine:3.21 sh -exc '
              sh tools/ci/prepare-musl-deps.sh /tmp/openppp2-3rd
              sh tools/ci/build-musl.sh "$ARCHITECTURE" "$VARIANT" Release /tmp/openppp2-3rd
              sh tools/ci/test-musl-network.sh
            '
          sudo chown -R "$(id -u):$(id -g)" bin build

      - name: Package artifact
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          suffix="-${VARIANT}"
          if [ "$VARIANT" = base ]; then suffix=""; fi
          package="openppp2-linux-amd64${suffix}"
          mkdir -p "build/${package}"
          cp bin/ppp "build/${package}/ppp"
          cp appsettings.json dns-rules.txt geo-rules.yaml firewall-rules.txt ip.txt ipv6.txt "build/${package}/"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PACKAGE }}
          path: build/${{ env.PACKAGE }}/
          if-no-files-found: error