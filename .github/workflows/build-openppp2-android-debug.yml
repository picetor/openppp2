name: Build OpenPPP2 Android Debug APK

on:
  push:
    branches:
      - inet6
    paths:
      - ".github/workflows/build-openppp2-android-debug.yml"
      - "android/**"
      - "common/**"
      - "ppp/**"
      - "linux/**"
      - "CMakeLists.txt"
  pull_request:
    branches:
      - inet6
    paths:
      - ".github/workflows/build-openppp2-android-debug.yml"
      - "android/**"
      - "common/**"
      - "ppp/**"
      - "linux/**"
      - "CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-debug:
    name: Android Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      FLUTTER_VERSION: "3.44.8"
      ANDROID_NDK_R20B: "20.1.5948944"
      ANDROID_NDK_FLUTTER: "28.2.13676358"
      ANDROID_THIRD_PARTY: ${{ github.workspace }}/.ci/android-third-party
      PUB_CACHE: ${{ github.workspace }}/.ci/pub-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK components
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          # Only the exact components this build needs; the runner already
          # ships other SDK versions we must not bloat the cache with.
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-36
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/36.0.0
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_R20B }}
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_FLUTTER }}
          key: android-sdk-36-r20b-28-v1

      - name: Install Android SDK and NDK packages
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_R20B}" \
            "ndk;${ANDROID_NDK_FLUTTER}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Android native dependencies
        id: android-native-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_THIRD_PARTY }}
          key: android-native-r20b-boost-1.74-openssl-1.1.1i-v1

      - name: Download Android native dependencies
        if: steps.android-native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "${ANDROID_THIRD_PARTY}"
          git clone --depth 1 \
            https://github.com/liulilittle/boost-1.74-for-android-r20b-fpic.git \
            "${ANDROID_THIRD_PARTY}/boost"
          git clone --depth 1 \
            https://github.com/liulilittle/openssl-1.1.1i-for-android-r20b.git \
            "${ANDROID_THIRD_PARTY}/openssl"

      - name: Set up ccache
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          mkdir -p "${GITHUB_WORKSPACE}/.ci/ccache"
          echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ci/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"
          ccache --version | head -n 1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          # ccache keys on the compiled content itself, so a stale cache is
          # still correct; bump the key when the toolchain changes.
          path: ${{ github.workspace }}/.ci/ccache
          key: ccache-android-r20b-${{ hashFiles('android/CMakeLists.txt') }}

      - name: Build native Android libraries
        shell: bash
        working-directory: android
        env:
          NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_R20B }}
          OTHER_ARGS: -DTHIRD_PARTY_LIBRARY_DIR=${{ env.ANDROID_THIRD_PARTY }}
        run: |
          chmod +x build.sh
          ./build.sh arm64
          ./build.sh x64
          test -s ../bin/android/arm64-v8a/libopenppp2.so
          test -s ../bin/android/x86_64/libopenppp2.so

      - name: Cache Android debug keystore
        # flutter debug builds sign with ~/.android/debug.keystore; a fresh
        # runner would generate a new keystore on every run, changing the APK
        # signature each build and breaking `adb install -r` over an existing
        # install. Cache the keystore so every build shares one signature.
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Restore signing keystore from secrets
        shell: bash
        working-directory: android
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "No signing keystore secret; using cached debug keystore"
            exit 0
          fi
          mkdir -p android/android/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/android/keystore/yav-release.keystore
          cat > android/android/keystore/yav-release-key.properties <<EOF
          storeFile=keystore/yav-release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "signing keystore restored from secret"

      - name: Install Flutter dependencies
        shell: bash
        working-directory: android
        run: flutter pub get

      - name: Cache pub cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-cache-${{ hashFiles('android/pubspec.lock') }}
          restore-keys: |
            pub-cache-

      - name: Run Flutter tests
        shell: bash
        working-directory: android
        run: flutter test

      - name: Build Debug APK
        shell: bash
        working-directory: android
        run: flutter build apk --debug

      - name: Verify APK contents
        shell: bash
        working-directory: android
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "${APK}"
          unzip -l "${APK}" | grep -F "lib/arm64-v8a/libopenppp2.so"
          unzip -l "${APK}" | grep -F "lib/x86_64/libopenppp2.so"
          sha256sum "${APK}" | tee build/app/outputs/flutter-apk/app-debug.apk.sha256

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openppp2-android-debug-${{ github.sha }}
          path: |
            android/build/app/outputs/flutter-apk/app-debug.apk
            android/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
