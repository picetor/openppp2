# =============================================================================
# OpenPPP2 GEO 分流策略
# =============================================================================
#
# 推荐启动方式：
#
#   ppp.exe --mode=client --config=./appsettings.json \
#       --server-dir=./servers \
#       --bypass-mode=geo \
#       --geo-rules=./geo-rules.yaml \
#       --geosite=./geosite.dat \
#       --geoip=./geoip.dat
#
# 各文件职责：
#
#   appsettings.json   主程序、TUN、DNS和默认服务器连接参数。
#   geo-rules.yaml     本文件，只负责GEO分流策略。
#   geosite.dat        域名分类数据库，由geosite规则按分类名称查询。
#   geoip.dat          IP国家/分类数据库，由geoip规则按分类名称查询。
#   servers/*.json     Servers页面的可切换节点，由--server-dir独立加载。
#
# 重要：
#
#   1. --server-dir与本文件完全独立。切换服务器不会重新加载分流规则。
#   2. 本文件仅在--bypass-mode=geo时使用。
#   3. --bypass-mode=ip只读取ip.txt、ipv6.txt和dns-rules.txt。
#   4. --bypass-mode=no不读取任何用户分流规则。
#
# -----------------------------------------------------------------------------
# YAML语法限制
# -----------------------------------------------------------------------------
#
# 当前使用针对GEO策略的严格YAML 1.2子集，不是任意YAML对象：
#
#   * 只能使用空格缩进，禁止Tab。
#   * 根字段支持：version、final、direct_dns、outbounds、rules。
#   * direct_dns和rules使用“- ”列表。
#   * rules严格按照书写顺序进行“首条命中”。
#   * 每条规则使用一个CSV标量：类型,值,动作。
#   * 不支持多行标量、锚点、别名、自定义标签及复杂嵌套对象。
#   * 可使用#注释，但规则值本身不能包含未转义的#。
#   * 建议使用UTF-8编码。
#
# YAML解析错误会报告行号，并拒绝启动GEO模式，避免静默使用错误策略。

# 配置格式版本。目前应填写1。
version: 1

# -----------------------------------------------------------------------------
# final：未匹配任何规则时的默认动作
# -----------------------------------------------------------------------------
#
# 可用值：
#
#   tunnel   使用当前Servers页面选中的VPN服务器。
#   main     仅在outbounds中声明main时使用，代表main GEO出口。
#   <标签>   使用outbounds中声明的同名出口。
#
# 普通单出口和Servers热切换模式推荐使用tunnel。
final: tunnel

# -----------------------------------------------------------------------------
# direct_dns：命中direct域名规则时使用的DNS
# -----------------------------------------------------------------------------
#
# local：
#
#   在Windows接管DNS之前，保存物理网卡原有DNS服务器。随后国内直连域名
#   通过这些DNS查询，避免请求进入VPN或递归查询虚拟网卡自身。
#
# 显式IP：
#
#   可以同时配置IPv4和IPv6 DNS。程序会自动去重。无效地址将导致GEO策略
#   加载失败。显式DNS的路由会固定到物理网络，并在VPN停止时清理。
#
# 查询行为：
#
#   * 只有命中direct域名规则的查询使用direct_dns。
#   * tunnel域名继续使用隧道DNS。
#   * DoH、DoT和DoQ不会被解密；其服务器域名/IP按普通连接进行分流。
direct_dns:
  - local
  # - 223.5.5.5
  # - 119.29.29.29
  # - 2400:3200::1

# -----------------------------------------------------------------------------
# outbounds：可选的GEO规则专用出口
# -----------------------------------------------------------------------------
#
# 一般情况下不要配置本段，使用tunnel即可跟随Servers页面的当前节点。
#
# outbounds用于“某些规则始终走固定配置”的高级场景。例如：
#
# outbounds:
#   main: ./appsettings.json
#   openai: ./outbounds/openai.json
#   backup: ./outbounds/backup.json
#
# 使用outbounds时：
#
#   * 必须声明main。
#   * 标签只能包含小写字母、数字、下划线和短横线。
#   * direct、tunnel和reject是保留名称，不能作为标签。
#   * 每个路径必须是可读取的OpenPPP2客户端JSON。
#   * 当前路径按程序工作目录解析，不按本YAML所在目录解析。
#   * 所有GEO出口会在启动时建立独立连接。
#   * outbounds不是Servers菜单；Servers菜单只读取--server-dir。
#   * 多GEO出口模式不支持--tun-static=yes。
#
# 当前策略没有启用固定GEO出口。

# -----------------------------------------------------------------------------
# rules：有序分流规则
# -----------------------------------------------------------------------------
#
# 格式：
#
#   - 类型,值,动作
#
# 动作：
#
#   direct    通过物理网络直连。
#   tunnel    使用Servers页面当前选中的VPN节点。
#   <标签>    使用outbounds中声明的固定GEO出口。
#
# 匹配原则：
#
#   * 从上到下检查，第一条命中规则生效。
#   * 更具体的规则应放在更宽泛的规则之前。
#   * 域名规则会观察DNS响应中的A/AAAA记录，并建立带TTL的IP策略。
#   * 纯IP连接只能匹配geoip、ip-cidr或ip-cidr6。
#   * 没有规则命中时使用final。
rules:
  # ---------------------------------------------------------------------------
  # domain：完整域名匹配
  # ---------------------------------------------------------------------------
  #
  # 只匹配指定域名本身，不匹配其子域名。
  #
  # 示例：
  #   domain,example.com,direct
  #
  # 会匹配example.com，但不会匹配www.example.com。

  # 国内加密DNS端点保持直连。
  - domain,dns.alidns.com,direct
  - domain,doh.pub,direct
  - domain,dot.pub,direct

  # 国外加密DNS端点通过当前VPN节点。
  - domain,cloudflare-dns.com,tunnel
  - domain,dns.google,tunnel
  - domain,dns.quad9.net,tunnel

  # Steam商店和社区通过VPN。
  - domain,store.steampowered.com,tunnel
  - domain,steamcommunity.com,tunnel

  # ---------------------------------------------------------------------------
  # domain-suffix：域名后缀匹配
  # ---------------------------------------------------------------------------
  #
  # 同时匹配根域名和其所有子域名。
  #
  #   domain-suffix,example.com,direct
  #
  # 可以匹配example.com、www.example.com和a.b.example.com。
  - domain-suffix,steamstatic.com,direct

  # ---------------------------------------------------------------------------
  # domain-keyword：域名关键词匹配
  # ---------------------------------------------------------------------------
  #
  # 域名中包含指定文本时命中。范围较宽，建议放在完整域名和后缀规则之后。
  #
  # - domain-keyword,github,tunnel

  # ---------------------------------------------------------------------------
  # domain-regex / regexp：正则表达式匹配
  # ---------------------------------------------------------------------------
  #
  # 使用Boost Perl兼容正则表达式，不区分大小写。正则编译失败会拒绝加载。
  # 正则开销高于domain/domain-suffix，应仅用于前两者无法表达的规则。
  #
  # - domain-regex,^.*\.example\.com$,tunnel

  # ---------------------------------------------------------------------------
  # geosite：按geosite.dat分类匹配域名
  # ---------------------------------------------------------------------------
  #
  # 分类名称不区分大小写。分类不存在或没有可用条目会拒绝加载。
  #
  # 可使用@属性筛选：
  #
  #   geosite,microsoft@cn,direct
  #
  # 多个属性写成：
  #
  #   geosite,category@attribute1@attribute2,direct
  - geosite,github,tunnel
  - geosite,microsoft,direct

  # ---------------------------------------------------------------------------
  # geoip：按geoip.dat分类匹配目标IP
  # ---------------------------------------------------------------------------
  #
  # cn通常表示中国大陆IPv4/IPv6地址集合。DNS域名解析出的目标IP以及直接
  # 输入的IP连接都可以命中。
  - geoip,cn,direct

  # ---------------------------------------------------------------------------
  # ip-cidr / ip-cidr6：手工CIDR匹配
  # ---------------------------------------------------------------------------
  #
  # ip-cidr只接受IPv4，ip-cidr6只接受IPv6。地址族或前缀无效会拒绝加载。
  #
  # - ip-cidr,192.168.0.0/16,direct
  # - ip-cidr,192.0.2.0/24,tunnel
  # - ip-cidr6,2001:db8::/32,tunnel

  # ---------------------------------------------------------------------------
  # 固定GEO出口示例
  # ---------------------------------------------------------------------------
  #
  # 仅当上方启用了同名outbounds时才能取消注释：
  #
  # - domain,api.openai.com,openai
  # - domain-suffix,example.net,backup
